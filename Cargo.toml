[package]
name = "pallet-content"
version = "0.1.0"
# authors.workspace = true
edition = "2021"
license = "MIT-0"
# homepage.workspace = true
# repository.workspace = true
description = "Content pallet"
readme = "README.md"

[lints]
# workspace = true

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]

[workspace]
members = [".", "pallet-account-content", "pallet-account-profile", "pallet-content-reactions"]
resolver = "2"

[workspace.dependencies]
codec = { version = "3.7.5", default-features = false, package = "parity-scale-codec" }
log = { version = "0.4.35", default-features = false }
scale-info = { version = "2.11.6", default-features = false }
# Single source of truth for the polkadot-sdk umbrella version, sourced from
# the published crates.io crate (not a git tag) so every crate in the workspace
# resolves one SDK and no SDK crate is version-pinned per-manifest.
#
# The `features` list enables the umbrella sub-crates the pallet code needs in
# *every* build, including the `no_std`/Wasm runtime build. These must live here
# (always on) rather than under the `std` feature, otherwise a
# `--no-default-features` build has no `frame_support` re-export at all. The
# `std` feature only adds the `*/std` halves on top.
polkadot-sdk = { version = "2609.2.0", default-features = false, features = [
	"frame-support",
	"frame-system",
	"sp-io",
] }

[dependencies]
codec = { workspace = true }
log = { workspace = true }
scale-info = { workspace = true }
polkadot-sdk = { workspace = true }

[features]
default = ["std"]
runtime-benchmarks = [
	"polkadot-sdk/runtime-benchmarks",
]
std = [
	"codec/std",
	"log/std",
	"polkadot-sdk/std",
	"polkadot-sdk/pallet-balances",
	"polkadot-sdk/sp-runtime",
	"scale-info/std",
]
try-runtime = [
	"polkadot-sdk/try-runtime",
]
