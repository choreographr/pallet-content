[package]
name = "pallet-content"
version = "0.1.0"
# authors.workspace = true
edition = "2021"
license = "MIT-0"
# homepage.workspace = true
# repository.workspace = true
description = "Content pallet"
readme = "README.md"

[lints]
# workspace = true

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]

[workspace]
members = [".", "pallet-account-content", "pallet-account-profile", "pallet-content-reactions"]
resolver = "2"

[workspace.dependencies]
codec = { version = "3.7.5", default-features = false, package = "parity-scale-codec" }
log = { version = "0.4.34", default-features = false }
scale-info = { version = "2.11.6", default-features = false }
# Single source of truth for the polkadot-sdk umbrella version, sourced from
# the published crates.io crate (not a git tag) so every crate in the workspace
# resolves one SDK and no SDK crate is version-pinned per-manifest.
polkadot-sdk = { version = "2609.0.0", default-features = false }

[dependencies]
codec = { workspace = true }
log = { workspace = true }
scale-info = { workspace = true }
polkadot-sdk = { workspace = true }

[features]
default = ["std"]
runtime-benchmarks = [
	"polkadot-sdk/runtime-benchmarks",
]
std = [
	"codec/std",
	"log/std",
	"polkadot-sdk/std",
	"polkadot-sdk/frame-support",
	"polkadot-sdk/frame-system",
	"polkadot-sdk/pallet-balances",
	"polkadot-sdk/sp-io",
	"polkadot-sdk/sp-runtime",
	"scale-info/std",
]
try-runtime = [
	"polkadot-sdk/try-runtime",
]
